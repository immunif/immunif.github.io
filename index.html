<title>영상 확인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #eee;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
    gap: 60px;
  }
  section {
    width: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 1.2rem;
    margin-bottom: 24px;
    font-weight: 500;
    color: #ccc;
    text-align: center;
  }

  /* ===== 9:16 영상 그리드: 5열 2줄 ===== */
  .video-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
  }
  .video-cell {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .yt-embed {
    width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    background: #000;
    overflow: hidden;
  }
  .yt-embed iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .download-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 6px;
    background: #FFFFF0;
    color: #111;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    transition: background 0.2s ease;
  }
  .download-btn:hover {
    background: #e6bf00;
  }

  @media (max-width: 1100px) {
    .video-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px) {
    .video-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

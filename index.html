<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비누영상확인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #eee;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  section {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 1.2rem;
    margin-bottom: 16px;
    font-weight: 500;
    color: #ccc;
    text-align: center;
  }
  .yt-embed {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    background: #000;
    overflow: hidden;
  }
  .yt-embed iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
  <section>
    <h1>비누 영상 확인(일부공애전용)</h1>
    <div class="yt-embed">
      <iframe src="https://www.youtube.com/embed/-Kv2nbNHQb0" title="비누영상확인" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
  </section>
</body>
</html>

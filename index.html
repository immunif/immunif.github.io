<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영상 확인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #eee;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
    gap: 60px;
  }
  section {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 1.2rem;
    margin-bottom: 16px;
    font-weight: 500;
    color: #ccc;
    text-align: center;
  }
  video {
    width: 100%;
    max-width: 960px;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    background: #000;
  }

  /* ===== 캐릭터 설명 섹션 ===== */
  .char-section h1 {
    align-self: flex-start;
    text-align: left;
  }
  .char-row {
    width: 100%;
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .char-video-box {
    flex: 1 1 55%;
    display: flex;
  }
  .char-video-box video {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 8px;
  }
  .char-right-col {
    flex: 1 1 45%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .char-slider {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .char-slider img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    animation: charFade 12s infinite;
  }
  .char-slider img:nth-child(1) { animation-delay: 0s; }
  .char-slider img:nth-child(2) { animation-delay: 4s; }
  .char-slider img:nth-child(3) { animation-delay: 8s; }
  @keyframes charFade {
    0%   { opacity: 0; }
    5%   { opacity: 1; }
    28%  { opacity: 1; }
    33%  { opacity: 0; }
    100% { opacity: 0; }
  }
  .char-text {
    font-size: 0.95rem;
    line-height: 1.7;
    color: #ccc;
  }
  .char-text strong {
    display: block;
    color: #eee;
    margin-bottom: 6px;
    font-weight: 600;
  }
  @media (max-width: 640px) {
    .char-row { flex-direction: column; }
  }
</style>
</head>
<body>
  <section>
    <h1>★이뮤니프 본이너스★</h1>
    <video controls preload="auto">
      <source src="https://github.com/immunif/immunif.github.io/releases/download/v1.0/default.mp4" type="video/mp4">
      브라우저가 video 태그를 지원하지 않습니다.
    </video>
  </section>
  <section>
    <h1>[AI휴먼] 미네랄이란 무엇인가</h1>
    <video controls preload="auto">
      <source src="https://github.com/Park-jh084/Park-jh084.github.io/releases/download/AI%ED%9C%B4%EB%A8%BC/default.mp4" type="video/mp4">
      브라우저가 video 태그를 지원하지 않습니다.
    </video>
  </section>

  <!-- 캐릭터 설명 섹션 -->
  <section class="char-section">
    <h1>캐릭터 설명</h1>
    <div class="char-row">
      <div class="char-video-box">
        <!-- 캐릭터 소개 영상: src를 원하는 영상 링크로 교체하세요 -->
        <video controls preload="auto">
          <source src="캐릭터_영상_URL.mp4" type="video/mp4">
          브라우저가 video 태그를 지원하지 않습니다.
        </video>
      </div>
      <div class="char-right-col">
        <!-- 이미지 슬라이더: 이미지 경로를 원하는 이미지로 교체하세요 (최대 3장, 자동 전환) -->
        <div class="char-slider">
          <img src="이미지1.jpg" alt="캐릭터 이미지 1">
          <img src="이미지2.jpg" alt="캐릭터 이미지 2">
          <img src="이미지3.jpg" alt="캐릭터 이미지 3">
        </div>
        <div class="char-text">
          <strong>캐릭터 이름</strong>
          여기에 캐릭터의 특징과 느낌 등을 설명하는 텍스트를 입력하세요.
        </div>
      </div>
    </div>
  </section>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비누영상확인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #eee;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  section {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 1.2rem;
    margin-bottom: 16px;
    font-weight: 500;
    color: #ccc;
    text-align: center;
  }
  .desc {
    font-size: 0.95rem;
    line-height: 1.7;
    color: #ffffff;
    text-align: center;
    margin-bottom: 24px;
    white-space: pre-line;
  }
  .desc .hl { color: #ffd400; }
  .download-row {
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }
  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 6px;
    background: #fffff0;
    color: #111;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.2s ease;
  }
  .download-btn:hover { background: #ebebd0; }
  .yt-embed {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    background: #000;
    overflow: hidden;
  }
  .yt-embed iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
  <section><br><br>
    <h1>비누영상확인용 (일부공개전용)</h1>
    
      <div class="yt-embed">
      <iframe src="https://www.youtube.com/embed/-Kv2nbNHQb0" title="비누영상확인" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <!-- 다운로드 버튼: 구글 드라이브 파일 직접 다운로드 -->
    <div class="download-row">
      <a class="download-btn"
         href="https://drive.usercontent.google.com/download?id=1IPb59J5kQPDJPMesXGmWWXdv7LmS7zAQ&export=download&confirm=t">
        ⬇ 영상 다운로드 (mp4)
      </a>
    </div>
  <p class="desc">
      2:07 - 3:10 구간 음원 저작권 주장 확인됨 (라이선스 보유여부 확인필요)
      스트리밍 최적화를 위한 youtube 일부공개 등록 공유됨
      파일크기: 2.72GB 
   (다운로드시 바이러스 검사 무시하고 다운로드 해주세요)
  <span class="hl">※ 영상이 최종 완료되면 영상을 모두 다운로드 해주세요 ※
      (다음 영상이 진행되면 기존 영상은 삭제됩니다.)</span> </p>

  </section>
</body>
</html>
